support: "https://github.com/CaioRuizz/ruiz-app-store/issues"
port: 4833
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "First release: Proton Mail Bridge 3.27.1 with a web terminal for login."
