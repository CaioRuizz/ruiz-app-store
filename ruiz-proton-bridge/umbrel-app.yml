manifestVersion: 1
id: ruiz-proton-bridge
name: Proton Mail Bridge
tagline: Use your Proton Mail account in Apple Mail and other IMAP clients
icon: https://raw.githubusercontent.com/CaioRuizz/ruiz-app-store/master/ruiz-proton-bridge/icon.svg
category: networking
version: "1.2.0"
description: >-
  Proton Mail Bridge built from Proton's official source code, running headless on
  your Umbrel so phones, tablets and computers on your network can use Proton Mail
  through IMAP and SMTP, for example in Apple Mail on iPhone and iPad.

  Open the app to get a terminal connected to the Bridge command line. Run "login"
  with your Proton credentials and 2FA, then "info" to see the IMAP/SMTP settings
  and the Bridge password to use in your mail client.

  For iPhone and iPad, open http://<your-umbrel>:4834 on the device to install a
  profile with the mail account and the certificate that protects it.

  IMAP listens on port 1143 and SMTP on port 1025 of your Umbrel. Keep them inside
  your network (or reach them through Tailscale): never forward them on your router.

  Bridge updates itself: it downloads Proton's signed updates and the official
  launcher switches to them, so you don't need to update the app for every Bridge
  release.

  Requires a paid Proton plan. Not affiliated with Proton AG.
developer: "Caio Ruiz"
website: "https://github.com/CaioRuizz/ruiz-app-store/tree/master/ruiz-proton-bridge"
dependencies: []
repo: "https://github.com/CaioRuizz/ruiz-app-store"
support: "https://github.com/CaioRuizz/ruiz-app-store/issues"
port: 4833
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "iPhone and iPad support: the app now creates a TLS certificate that iOS accepts (its own CA plus an 825-day server certificate, renewed automatically) and serves an iOS profile with the certificate and the mail account on port 4834."
