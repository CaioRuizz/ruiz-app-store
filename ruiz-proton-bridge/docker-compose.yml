version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ruiz-proton-bridge_bridge_1
      APP_PORT: 7681
      # O terminal web dá acesso à conta do Proton: o login do Umbrel fica ligado (padrão).

  bridge:
    image: caioruizz/ruiz-proton-bridge-bridge:1.1.0
    volumes:
      - "${APP_DATA_DIR:-.}/data/bridge:/data"
    ports:
      # IMAP e SMTP para o Apple Mail e outros clientes. Ficam acessíveis na rede local e pelo
      # Tailscale; não encaminhe estas portas no roteador.
      - "1143:2143"
      - "1025:2025"
    restart: on-failure
    stop_grace_period: 30s
