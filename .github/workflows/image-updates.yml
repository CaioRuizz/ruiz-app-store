name: Check third-party image updates

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: image-updates
  cancel-in-progress: false

jobs:
  check-image-updates:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Find updates and open pull requests
        env:
          GH_USER: github-actions[bot]
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/image_updates.py
