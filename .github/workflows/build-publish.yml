name: Build and publish app images

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish app images
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r dockerfile; do
            dir="${dockerfile%/Dockerfile}"
            app="${dir%%/*}"
            image="$DH_USER/$(printf '%s' "$dir" | tr / -)"
            version="$(sed -nE 's/^[[:space:]]*version:[[:space:]]*"?([^" ]+)"?.*/\1/p' "$app/umbrel-app.yml" | head -n 1)"
            if [[ -z "$version" ]]; then
              echo "Could not read app version from $app/umbrel-app.yml" >&2
              exit 1
            fi
            echo "==> $image:$version"
            docker buildx build --push -t "$image:latest" -t "$image:$version" "$dir"
          done < <(find . -path './ruiz-*/*/Dockerfile' -type f | sort)

      - name: Update app image versions in compose files
        shell: bash
        run: |
          set -euo pipefail
          for app_path in ruiz-*/; do
            app="${app_path%/}"
            version="$(sed -nE 's/^[[:space:]]*version:[[:space:]]*"?([^" ]+)"?.*/\1/p' "$app/umbrel-app.yml" | head -n 1)"
            if [[ -z "$version" ]]; then
              echo "Could not read app version from $app/umbrel-app.yml" >&2
              exit 1
            fi
            sed -E -i "s|(image: [^/: ]+/ruiz-[^: ]+):([0-9]+\.[0-9]+\.[0-9]+)|\1:$version|g" "$app/docker-compose.yml"
          done

          if git diff --quiet -- 'ruiz-*/docker-compose.yml'; then
            echo "No compose image versions to update."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'ruiz-*/docker-compose.yml'
          git commit -m "chore: update docker-compose image versions [skip ci]"
          git push origin HEAD:master
