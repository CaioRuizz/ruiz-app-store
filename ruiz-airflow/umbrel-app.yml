manifestVersion: 1
id: ruiz-airflow
name: Airflow
tagline: Schedule and monitor data pipelines, with an isolated Docker for your tasks
icon: https://raw.githubusercontent.com/CaioRuizz/ruiz-app-store/master/ruiz-airflow/icon.svg
category: developer-tools
version: "1.1.1"
description: >-
  The official Apache Airflow 3 image, ready to run on your Umbrel: PostgreSQL
  for metadata, the LocalExecutor, and a separate Docker daemon
  (Docker-in-Docker) for tasks that run in containers.

  Log in with the user "admin" and the password shown by Umbrel for this app.
  The password is applied only on the first start, so changing it later in
  Airflow sticks.

  DAGs are read from the app's data/dags folder by default. To read them from Git
  repositories (Gitea, GitHub...), open Admin > DAG bundles in Airflow: add the
  repository and token, test access and apply, without editing files or
  restarting the app in Umbrel.

  DockerOperator tasks run on the isolated Docker daemon, which cannot touch the
  Docker that runs your Umbrel apps.
developer: "Caio Ruiz"
website: "https://github.com/CaioRuizz/ruiz-app-store/tree/master/ruiz-airflow"
dependencies: []
repo: "https://github.com/CaioRuizz/ruiz-app-store"
support: "https://github.com/CaioRuizz/ruiz-app-store/issues"
port: 4832
gallery: []
path: ""
defaultUsername: "admin"
deterministicPassword: true
releaseNotes: "Automatic daily cleanup of the isolated Docker: stopped containers, unused images older than 7 days and build cache above 10 GB."
