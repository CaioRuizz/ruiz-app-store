version: "3.7"

networks:
  umbrel_main_network:
    external: true
  ruiz-gitea-runner_network:
    driver: bridge

services:
  app_proxy:
    environment:
      APP_HOST: ruiz-gitea-runner_nginx_1
      APP_PORT: 80
    networks:
      - umbrel_main_network
      - ruiz-gitea-runner_network
    restart: on-failure

  nginx:
    image: caioruizz/ruiz-gitea-runner-nginx:1.3.0
    depends_on:
      - backend
      - frontend
    networks:
      - ruiz-gitea-runner_network
    restart: on-failure

  backend:
    image: caioruizz/ruiz-gitea-runner-backend:1.3.0
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/data
      # O act_runner (processo filho do backend) roda os jobs no Docker isolado deste app e monta
      # esse mesmo socket nos containers dos jobs; nenhum job enxerga o Docker dos apps do Umbrel.
      - DOCKER_HOST=unix:///var/run/dind/docker.sock
    volumes:
      - "${APP_DATA_DIR:-./umbrel-data}/data:/data"
      - "${APP_DATA_DIR:-./umbrel-data}/docker/socket:/var/run/dind"
    depends_on:
      - docker
    networks:
      - ruiz-gitea-runner_network
    restart: on-failure

  frontend:
    image: caioruizz/ruiz-gitea-runner-frontend:1.3.0
    environment:
      - NODE_ENV=production
    networks:
      - ruiz-gitea-runner_network
    restart: on-failure

  # Docker isolado para os jobs (Docker-in-Docker). O runner fala com ele pelo socket
  # /var/run/dind/docker.sock, sem porta de rede e sem acesso ao Docker que roda os apps do Umbrel.
  # Containers, imagens, volumes e redes dos jobs ficam todos aqui dentro.
  docker:
    image: docker:29.8.2-dind
    privileged: true
    command: ["dockerd", "--host=unix:///var/run/dind/docker.sock"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - "${APP_DATA_DIR:-./umbrel-data}/docker/lib:/var/lib/docker"
      # Configuração opcional do Docker isolado: um daemon.json criado nesta pasta (por exemplo,
      # com "insecure-registries") é lido pelo dockerd ao iniciar e sobrevive às atualizações do app.
      - "${APP_DATA_DIR:-./umbrel-data}/docker/config:/etc/docker"
      - "${APP_DATA_DIR:-./umbrel-data}/docker/socket:/var/run/dind"
    networks:
      - ruiz-gitea-runner_network
    restart: on-failure

  # Limpeza automática do Docker isolado, uma vez por dia: containers parados há mais de 24 h, imagens
  # criadas há mais de CLEANUP_IMAGES_UNUSED_FOR que nenhum container esteja usando, volumes anônimos sem
  # uso e o cache de build acima de CLEANUP_BUILD_CACHE_MAX. Nada em uso é apagado; o que for removido é
  # baixado ou reconstruído de novo quando precisar.
  docker-cleanup:
    image: docker:29.8.2-dind
    entrypoint:
      - sh
      - -c
      - |
        sleep 600
        while true; do
          echo "== Limpeza do Docker isolado ($$(date '+%F %T'))"
          docker container prune -f --filter "until=24h"
          docker image prune -af --filter "until=$${CLEANUP_IMAGES_UNUSED_FOR}"
          docker builder prune -af --max-used-space "$${CLEANUP_BUILD_CACHE_MAX}"
          docker volume prune -f
          docker system df
          sleep $$(( $${CLEANUP_INTERVAL_HOURS} * 3600 ))
        done
    environment:
      DOCKER_HOST: unix:///var/run/dind/docker.sock
      CLEANUP_INTERVAL_HOURS: "24"
      CLEANUP_IMAGES_UNUSED_FOR: "168h"
      CLEANUP_BUILD_CACHE_MAX: "10GB"
    volumes:
      - "${APP_DATA_DIR:-./umbrel-data}/docker/socket:/var/run/dind"
    depends_on:
      - docker
    networks:
      - ruiz-gitea-runner_network
    restart: on-failure
