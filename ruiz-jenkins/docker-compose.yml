version: "3.7"

networks:
  umbrel_main_network:
    external: true
  ruiz-jenkins_network:
    driver: bridge

services:
  app_proxy:
    environment:
      APP_HOST: ruiz-jenkins_jenkins_1
      APP_PORT: 8080
      # O Jenkins tem login próprio; sem isso o Umbrel pediria uma segunda senha
      # e bloquearia os webhooks do GitHub e do Gitea.
      PROXY_AUTH_ADD: "false"
    networks:
      - umbrel_main_network
      - ruiz-jenkins_network
    restart: on-failure

  jenkins:
    # Imagem oficial do Jenkins, sem customização
    image: jenkins/jenkins:2.580.1-lts-jdk21
    environment:
      # Senha do app gerada pelo Umbrel; init.groovy.d/umbrel-password.groovy a usa como senha inicial
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - "${APP_DATA_DIR:-./umbrel-data}/data/jenkins_home:/var/jenkins_home"
      - "${APP_DATA_DIR:-.}/init.groovy.d:/var/jenkins_home/init.groovy.d:ro"
      - "${APP_DATA_DIR:-./umbrel-data}/data/docker-socket:/var/run/dind"
    depends_on:
      - docker
    networks:
      - ruiz-jenkins_network
    restart: on-failure
    stop_grace_period: 1m

  # Docker isolado para os builds (Docker-in-Docker). O Jenkins fala com ele pelo socket
  # /var/run/dind/docker.sock (plugin "Docker", nuvem unix:///var/run/dind/docker.sock), sem porta
  # de rede e sem acesso ao Docker que roda os apps do Umbrel. O socket pertence ao grupo 1000,
  # o mesmo usuário do Jenkins.
  docker:
    image: docker:29.9.2-dind
    privileged: true
    command: ["dockerd", "--host=unix:///var/run/dind/docker.sock", "--group=1000"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - "${APP_DATA_DIR:-./umbrel-data}/data/docker:/var/lib/docker"
      # Configuração opcional do Docker isolado: um daemon.json criado nesta pasta (por exemplo,
      # com "insecure-registries") é lido pelo dockerd ao iniciar e sobrevive às atualizações do app.
      - "${APP_DATA_DIR:-./umbrel-data}/data/docker-config:/etc/docker"
      - "${APP_DATA_DIR:-./umbrel-data}/data/docker-socket:/var/run/dind"
    networks:
      - ruiz-jenkins_network
    restart: on-failure
