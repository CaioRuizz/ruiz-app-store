version: "3.7"

networks:
  umbrel_main_network:
    external: true
  ruiz-jenkins_network:
    driver: bridge

services:
  app_proxy:
    environment:
      APP_HOST: ruiz-jenkins_jenkins_1
      APP_PORT: 8080
      # O Jenkins tem login próprio; sem isso o Umbrel pediria uma segunda senha
      # e bloquearia os webhooks do GitHub e do Gitea.
      PROXY_AUTH_ADD: "false"
    networks:
      - umbrel_main_network
      - ruiz-jenkins_network
    restart: on-failure

  jenkins:
    # Imagem oficial do Jenkins, sem customização
    image: jenkins/jenkins:2.580.2-lts-jdk21
    environment:
      # Senha do app gerada pelo Umbrel; init.groovy.d/umbrel-password.groovy a usa como senha inicial
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - "${APP_DATA_DIR:-./umbrel-data}/data/jenkins_home:/var/jenkins_home"
      - "${APP_DATA_DIR:-.}/init.groovy.d:/var/jenkins_home/init.groovy.d:ro"
      - "${APP_DATA_DIR:-./umbrel-data}/data/docker-socket:/var/run/dind"
    depends_on:
      - docker
    networks:
      - ruiz-jenkins_network
    restart: on-failure
    stop_grace_period: 1m

  # Docker isolado para os builds (Docker-in-Docker). O Jenkins fala com ele pelo socket
  # /var/run/dind/docker.sock (plugin "Docker", nuvem unix:///var/run/dind/docker.sock), sem porta
  # de rede e sem acesso ao Docker que roda os apps do Umbrel. O socket pertence ao grupo 1000,
  # o mesmo usuário do Jenkins.
  docker:
    image: docker:29.9.2-dind
    privileged: true
    command: ["dockerd", "--host=unix:///var/run/dind/docker.sock", "--group=1000"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - "${APP_DATA_DIR:-./umbrel-data}/data/docker:/var/lib/docker"
      # Configuração opcional do Docker isolado: um daemon.json criado nesta pasta (por exemplo,
      # com "insecure-registries") é lido pelo dockerd ao iniciar e sobrevive às atualizações do app.
      - "${APP_DATA_DIR:-./umbrel-data}/data/docker-config:/etc/docker"
      - "${APP_DATA_DIR:-./umbrel-data}/data/docker-socket:/var/run/dind"
    networks:
      - ruiz-jenkins_network
    restart: on-failure

  # Limpeza automática do Docker isolado, uma vez por dia: containers parados há mais de 24 h, imagens
  # criadas há mais de CLEANUP_IMAGES_UNUSED_FOR que nenhum container esteja usando, volumes anônimos sem
  # uso e o cache de build acima de CLEANUP_BUILD_CACHE_MAX. Nada em uso é apagado; o que for removido é
  # baixado ou reconstruído de novo quando precisar.
  docker-cleanup:
    image: docker:29.9.2-dind
    entrypoint:
      - sh
      - -c
      - |
        sleep 600
        while true; do
          echo "== Limpeza do Docker isolado ($$(date '+%F %T'))"
          docker container prune -f --filter "until=24h"
          docker image prune -af --filter "until=$${CLEANUP_IMAGES_UNUSED_FOR}"
          docker builder prune -af --max-used-space "$${CLEANUP_BUILD_CACHE_MAX}"
          docker volume prune -f
          docker system df
          sleep $$(( $${CLEANUP_INTERVAL_HOURS} * 3600 ))
        done
    environment:
      DOCKER_HOST: unix:///var/run/dind/docker.sock
      CLEANUP_INTERVAL_HOURS: "24"
      CLEANUP_IMAGES_UNUSED_FOR: "168h"
      CLEANUP_BUILD_CACHE_MAX: "10GB"
    volumes:
      - "${APP_DATA_DIR:-./umbrel-data}/data/docker-socket:/var/run/dind"
    depends_on:
      - docker
    networks:
      - ruiz-jenkins_network
    restart: on-failure
