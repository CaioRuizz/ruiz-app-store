manifestVersion: 1
id: ruiz-jenkins
name: Jenkins
tagline: Self-hosted CI/CD server with an isolated Docker for your pipelines
icon: https://raw.githubusercontent.com/CaioRuizz/ruiz-app-store/master/ruiz-jenkins/icon.svg
category: developer-tools
version: "1.0.1"
description: >-
  The official Jenkins LTS image, ready to run on your Umbrel, plus a separate
  Docker daemon (Docker-in-Docker) for your builds.

  On first launch Jenkins shows its setup wizard. The initial admin password is
  printed in the app logs and saved in
  data/jenkins_home/secrets/initialAdminPassword inside the app data folder.
  Install the suggested plugins and create your admin user.

  To build and run containers in your pipelines, install the "Docker" plugin and
  add a Docker cloud pointing to unix:///var/run/dind/docker.sock. That daemon is isolated from
  the Docker that runs your Umbrel apps, so a pipeline cannot touch them.
developer: "Caio Ruiz"
website: "https://github.com/CaioRuizz/ruiz-app-store/tree/master/ruiz-jenkins"
dependencies: []
repo: "https://github.com/CaioRuizz/ruiz-app-store"
support: "https://github.com/CaioRuizz/ruiz-app-store/issues"
port: 4831
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "Uses the official Jenkins 2.580.1 LTS (JDK 21) image, with an isolated Docker 29.8 daemon for builds."
