version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ruiz-redis_redisinsight_1
      APP_PORT: 5540
      # O Redis Insight não tem login próprio: o login do Umbrel fica ligado (padrão).

  redis:
    image: redis:8.10.2
    # Mesmo dono dos dados do Umbrel (a imagem usaria o uid 999, sem permissão na pasta)
    user: "1000:1000"
    # Senha = senha do Umbrel para este app; AOF + snapshots para não perder dados ao reiniciar
    command:
      - redis-server
      - --requirepass
      - ${APP_PASSWORD:-redis}
      - --appendonly
      - "yes"
      - --save
      - "3600 1 300 100 60 10000"
    environment:
      REDISCLI_AUTH: ${APP_PASSWORD:-redis}
    volumes:
      - "${APP_DATA_DIR:-.}/data/redis:/data"
    ports:
      # Conexões dos seus projetos (rede local e Tailscale); não encaminhe no roteador
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: on-failure
    stop_grace_period: 30s

  redisinsight:
    image: redis/redisinsight:3.8.0
    # Na primeira abertura, aceite os termos e adicione o banco: host "redis", porta 6379,
    # usuário "default" e a senha do Umbrel para este app
    volumes:
      - "${APP_DATA_DIR:-.}/data/redisinsight:/data"
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
